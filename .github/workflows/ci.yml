name: regression-tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pytest -q --junitxml=regression.xml
      - run: python scripts/run_demo.py --output demo-output-ci
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-and-regression-evidence
          path: |
            dist/*
            regression.xml
            demo-output-ci/*
  release-assets:
    if: github.event_name == 'release'
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-and-regression-evidence
          path: tested-release
      - name: Attach tested wheel/source archive to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" tested-release/dist/* --clobber
